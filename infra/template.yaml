AWSTemplateFormatVersion: "2010-09-09"
Description: >
  서울 청년정책 안내 챗봇 - 2주차 기본 환경
  (문서 저장소 S3, 정책·기록 DynamoDB, 최소 권한 IAM 역할, Lambda + HTTP API, S3 + CloudFront 프론트엔드)

Parameters:
  ProjectName:
    Type: String
    Default: yp-chatbot
  Stage:
    Type: String
    Default: dev

Resources:
  # ---------- 문서 저장소 (raw/ · processed/) ----------
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-docs-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ---------- 웹 프론트엔드 (비공개 S3 + CloudFront OAC) ----------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-web-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-${Stage}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName}-${Stage} web"
        DefaultRootObject: index.html
        PriceClass: PriceClass_200
        Origins:
          - Id: web-s3
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: web-s3
          ViewerProtocolPolicy: redirect-to-https
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

  # ---------- 메타데이터 · 기록 (DynamoDB) ----------
  PoliciesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Stage}-policies"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: policyId
          AttributeType: S
      KeySchema:
        - AttributeName: policyId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  ChatLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Stage}-chatlogs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: logId
          AttributeType: S
      KeySchema:
        - AttributeName: logId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------- 최소 권한 IAM 역할 ----------
  PoliciesFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Stage}-policies-fn"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-policies-table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Scan, dynamodb:Query]
                Resource: !GetAtt PoliciesTable.Arn

  ChatFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Stage}-chat-fn"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: chat-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadPolicyList
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Scan, dynamodb:Query]
                Resource: !GetAtt PoliciesTable.Arn
              - Sid: WriteAnonymousLogs
                Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt ChatLogsTable.Arn
              - Sid: InvokeBedrockModels
                Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource:
                  - !Sub "arn:aws:bedrock:*::foundation-model/*"
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Sid: QueryVectors
                Effect: Allow
                Action: [s3vectors:QueryVectors, s3vectors:GetVectors]
                Resource: !Sub "arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${ProjectName}-vectors-${AWS::AccountId}/*"

  # 문서 처리 흐름이 쓸 역할 (3주차부터 사용). raw/ 읽기, processed/ 쓰기만 허용
  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Stage}-ingest-fn"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ingest-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadRaw
                Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub "${DocsBucket.Arn}/raw/*"
              - Sid: WriteRawAndProcessed
                Effect: Allow
                Action: [s3:PutObject]
                Resource:
                  - !Sub "${DocsBucket.Arn}/raw/*"
                  - !Sub "${DocsBucket.Arn}/processed/*"
              - Sid: WritePolicyMeta
                Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt PoliciesTable.Arn

  # ---------- Lambda ----------
  PoliciesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Stage}-policies"
      RetentionInDays: 90

  ChatLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Stage}-chat"
      RetentionInDays: 90

  PoliciesFunction:
    Type: AWS::Lambda::Function
    DependsOn: PoliciesLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-${Stage}-policies"
      Runtime: python3.13
      Handler: app.handler
      Code: ../backend/policies
      Role: !GetAtt PoliciesFunctionRole.Arn
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          POLICIES_TABLE: !Ref PoliciesTable

  ChatFunction:
    Type: AWS::Lambda::Function
    DependsOn: ChatLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-${Stage}-chat"
      Runtime: python3.13
      Handler: app.handler
      Code: ../backend/chat
      Role: !GetAtt ChatFunctionRole.Arn
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          POLICIES_TABLE: !Ref PoliciesTable
          CHATLOGS_TABLE: !Ref ChatLogsTable
          LOG_TTL_DAYS: "90"

  # ---------- HTTP API (API Gateway v2) ----------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-${Stage}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${WebDistribution.DomainName}"
          - "http://localhost:5500"
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${ProjectName}-${Stage}-api"
      RetentionInDays: 90

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","time":"$context.requestTime","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency"}'

  PoliciesIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PoliciesFunction.Arn
      PayloadFormatVersion: "2.0"

  ChatIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ChatFunction.Arn
      PayloadFormatVersion: "2.0"

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /health
      Target: !Sub "integrations/${PoliciesIntegration}"

  PoliciesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /policies
      Target: !Sub "integrations/${PoliciesIntegration}"

  ChatRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /chat
      Target: !Sub "integrations/${ChatIntegration}"

  PoliciesInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PoliciesFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

  ChatInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ChatFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

Outputs:
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  WebUrl:
    Value: !Sub "https://${WebDistribution.DomainName}"
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref WebDistribution
  DocsBucketName:
    Value: !Ref DocsBucket
  PoliciesTableName:
    Value: !Ref PoliciesTable
  ChatLogsTableName:
    Value: !Ref ChatLogsTable
